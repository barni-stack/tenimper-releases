name: Publish public APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-ebac-8246-af49-62e1780f1d1f/raw?se=2026-09-26T11%3A13%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=2a98c3c5-b7fd-5576-9942-b7e100e57e99&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T07%3A10%3A06Z&ske=2026-09-27T07%3A10%3A06Z&sks=b&skv=2026-02-06&sig=U6WV6VPk0B9I5mdTFsRZHqZpvHU4GwOmt1OPkuyb4ME%3D'
      RELEASE_TAG: v75-comments-bridge
      APK_NAME: TenImper-Reader-v75-COMMENTS-BRIDGE-GITHUB.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private build artifact handoff
        shell: bash
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p dist
          unzip -j artifact.zip '*.apk' -d dist
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          if [ "$APK" != "dist/$APK_NAME" ]; then
            mv "$APK" "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME"

      - name: Publish v75 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v75 — Comments Bridge
          body: |
            Публичный APK-релиз приложения «Тень Императора».

            v75:
            - комментарии в Reader работают через bearer JSON API;
            - убран автоматический откат записи комментариев на cookie/CSRF;
            - кэш комментариев разделён по пользователям;
            - добавлена нативная жалоба на комментарий;
            - для полноценной работы нужен SITE PATCH v75 с /api/v1/comments.php.

            Исходный код и ключи подписи в этом публичном репозитории не публикуются.
          files: dist/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
