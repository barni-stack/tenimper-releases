name: Publish public APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5678-8246-a148-58025550fb76/raw?se=2026-09-25T13%3A31%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=55a11a04-f1d9-5c0e-aa62-ba882b9a4518&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T09%3A45%3A18Z&ske=2026-09-26T09%3A45%3A18Z&sks=b&skv=2026-02-06&sig=3n3FW2BcGeRMBLBDqwI96ftLAglqKTT0PFFHMDSWoYk%3D'
      RELEASE_TAG: v74-native-vestnik
      APK_NAME: TenImper-Reader-v74-NATIVE-VESTNIK-GITHUB.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private build artifact handoff
        shell: bash
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p dist
          unzip -j artifact.zip '*.apk' -d dist
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          if [ "$APK" != "dist/$APK_NAME" ]; then
            mv "$APK" "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME"

      - name: Publish v74 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v74 — Native Vestnik Routing
          body: |
            Публичный APK-релиз приложения «Тень Императора».

            v74:
            - Вестник открывает ответы в нативных комментариях;
            - новые главы открываются сразу в Reader;
            - титулы и рамки ведут в нативный профиль;
            - воспоминания ведут в личный архив;
            - новости автора из Павильона открываются нативно;
            - WebView остаётся только запасным маршрутом для неизвестных ссылок.

            Исходный код и ключи подписи в этом публичном репозитории не публикуются.
          files: dist/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
