name: Publish public APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7a64-81f4-8d28-755363f9619a/raw?se=2026-09-25T13%3A24%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=2576b6f6-33db-553c-9dba-ce4f1503ad84&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T11%3A43%3A05Z&ske=2026-09-26T11%3A43%3A05Z&sks=b&skv=2026-02-06&sig=Tg7OfB0Tr/ZH3rba8s0JUwUh2%2BPByHDV%2B6vIFtKuBlY%3D'
      RELEASE_TAG: v73-native-support
      APK_NAME: TenImper-Reader-v73-NATIVE-SUPPORT-GITHUB.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private build artifact handoff
        shell: bash
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p dist
          unzip -j artifact.zip '*.apk' -d dist
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          if [ "$APK" != "dist/$APK_NAME" ]; then
            mv "$APK" "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME"

      - name: Publish v73 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v73 — Native Support
          body: |
            Публичный APK-релиз приложения «Тень Императора».

            v73:
            - нативный экран поддержки в Покоях;
            - создание новых обращений;
            - список своих тикетов;
            - чтение переписки и ответы;
            - безопасный переход на веб-поддержку, если серверный адаптер ещё не установлен.

            Исходный код и ключи подписи в этом публичном репозитории не публикуются.
          files: dist/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
