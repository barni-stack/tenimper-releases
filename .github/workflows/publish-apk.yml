name: Publish public APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-4a1c-8246-a424-8836ca1f7a02/raw?se=2026-09-25T06%3A45%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=aca8f2df-52ad-5a87-809e-acff2506e461&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T06%3A22%3A50Z&ske=2026-09-26T06%3A22%3A50Z&sks=b&skv=2026-02-06&sig=isQYsWTTv/TrgtqGQf%2B7gcHBcr24vqV4X2k1r7f7V6k%3D'
      RELEASE_TAG: v71-native-comments
      APK_NAME: TenImper-Reader-v71-NATIVE-COMMENTS-GITHUB.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private build artifact handoff
        shell: bash
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p dist
          unzip -j artifact.zip '*.apk' -d dist
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          if [ "$APK" != "dist/$APK_NAME" ]; then
            mv "$APK" "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME"

      - name: Publish v71 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v71 — Native Comments
          body: |
            Публичный APK-релиз приложения «Тень Императора».

            v71:
            - ответы из Вестника открываются в нативном обсуждении;
            - чтение, ответы, реакции, изменение и удаление работают через API;
            - старый CommentsActivity сохранён как аварийный fallback;
            - Splash, старт, тема и логика обложек не менялись.

            Исходный код и ключи подписи в этом публичном репозитории не публикуются.
          files: dist/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
