name: Publish public APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-4450-8243-8751-8d9a7a0831a1/raw?se=2026-09-25T07%3A44%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=687fa2f1-a6bd-5aab-94ac-0d941b9ce90c&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T06%3A57%3A55Z&ske=2026-09-26T06%3A57%3A55Z&sks=b&skv=2026-02-06&sig=Mxev9RllkxbWkfhq26CKg4OUG9L/GzqxtVnBJt8tycU%3D'
      RELEASE_TAG: v72-offline-library
      APK_NAME: TenImper-Reader-v72-OFFLINE-LIBRARY-GITHUB.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private build artifact handoff
        shell: bash
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p dist
          unzip -j artifact.zip '*.apk' -d dist
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          if [ "$APK" != "dist/$APK_NAME" ]; then
            mv "$APK" "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME"

      - name: Publish v72 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v72 — Offline Library
          body: |
            Публичный APK-релиз приложения «Тень Императора».

            v72:
            - главы можно явно сохранять для чтения без сети;
            - в разделе «Читать» появился экран «Сохранено офлайн»;
            - офлайн-библиотека показывает прогресс и открывает сохранённые главы;
            - можно удалить одну или все офлайн-копии;
            - нативные комментарии v71 сохранены без изменений.

            Исходный код и ключи подписи в этом публичном репозитории не публикуются.
          files: dist/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
