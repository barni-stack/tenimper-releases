name: Publish public Android APK

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: "Temporary URL for a ZIP containing the APK"
        required: true
      release_tag:
        description: "Release tag"
        required: true
      apk_filename:
        description: "APK filename inside the ZIP"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUNDLE_URL: ${{ inputs.bundle_url }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download v82 APK bundle
        shell: bash
        run: |
          curl -fL --retry 3 "$BUNDLE_URL" -o bundle.zip
          mkdir -p dist
          unzip -j bundle.zip -d dist
          test -f "dist/${{ inputs.apk_filename }}"
          sha256sum dist/*

      - name: Publish v82 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v82 — Illustrated Reader
          body: |
            Версия v82: иллюстрированная главная с Тан Юем и Ли Анем, пергаментная читалка и компактный ряд Хроник.
            Сайт не меняется; API, главы и комментарии используют существующую интеграцию.
          files: |
            dist/${{ inputs.apk_filename }}
          prerelease: true
          make_latest: true
