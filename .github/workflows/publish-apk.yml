name: Publish public APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5798-8246-9ffb-254f87d6817b/raw?se=2026-09-25T06%3A27%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=1aff38ea-4fe7-5d8f-a731-0e3d26dd268b&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T05%3A44%3A46Z&ske=2026-09-26T05%3A44%3A46Z&sks=b&skv=2026-02-06&sig=Lrl3PR5sONp5XiuzeqpJY9vP/Xyd7zp0sefuTVNgUM0%3D'
      RELEASE_TAG: v70-native-pavilion
      APK_NAME: TenImper-Reader-v70-NATIVE-PAVILION-GITHUB.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private build artifact handoff
        shell: bash
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p dist
          unzip -j artifact.zip '*.apk' -d dist
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          if [ "$APK" != "dist/$APK_NAME" ]; then
            mv "$APK" "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME"

      - name: Publish v70 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v70 — Native Pavilion
          body: |
            Публичный APK-релиз приложения «Тень Императора».

            v70:
            - вести Павильона читаются нативно внутри приложения;
            - полный текст новости берётся из api/v1/pavilion.php;
            - добавлен аватар автора в Павильоне;
            - больше не нужен переход на веб-страницу для чтения вести.

            Исходный код и ключи подписи в этом публичном репозитории не публикуются.
          files: dist/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
