name: Publish public APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-1f04-8246-93e3-3b39493a56da/raw?se=2026-09-25T06%3A19%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=22dd2e8f-4134-5e9d-8c62-97cdac388643&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T05%3A44%3A46Z&ske=2026-09-26T05%3A44%3A46Z&sks=b&skv=2026-02-06&sig=zn5XZ0cDeslFr5XL/pbDMY50Rsdss5jq9GkQRv3dfj0%3D'
      RELEASE_TAG: v69-update-checker
      APK_NAME: TenImper-Reader-v69-UPDATE-CHECKER-GITHUB.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download private build artifact handoff
        shell: bash
        run: |
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p dist
          unzip -j artifact.zip '*.apk' -d dist
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          if [ "$APK" != "dist/$APK_NAME" ]; then
            mv "$APK" "dist/$APK_NAME"
          fi
          sha256sum "dist/$APK_NAME"

      - name: Publish v69 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TenImper Reader v69 — Update Checker
          body: |
            Публичный APK-релиз приложения «Тень Императора».

            v69:
            - встроенная проверка обновлений;
            - текущая версия показывается в настройках;
            - проверка публичного tenimper-releases;
            - кнопка скачивания нового APK прямо из публичного релиза.

            Исходный код и ключи подписи в этом публичном репозитории не публикуются.
          files: dist/${{ env.APK_NAME }}
          prerelease: false
          make_latest: true
